plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

group = 'com.jasper'
version = '0.0.1-SNAPSHOT'
description = 'invoice-intelligence'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.apache.pdfbox:pdfbox:3.0.5'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'net.sourceforge.tess4j:tess4j:5.20.0'

    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-test-autoconfigure'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform {
        if (!project.hasProperty('ollama')) {
            excludeTags 'ollama'
        }
    }
    systemProperty 'spring.profiles.active', 'test'
    exclude '**/*OcrTextExtractorIntegrationTest.class'
    exclude '**/*FallbackDocumentTextExtractorIntegrationTest.class'
}

tasks.register('ocrTest', Test) {
    description = 'Runs OCR integration tests in an isolated JVM'
    group = 'verification'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform()
    systemProperty 'spring.profiles.active', 'test'

    filter {
        includeTestsMatching '*OcrTextExtractorIntegrationTest'
        includeTestsMatching '*FallbackDocumentTextExtractorIntegrationTest'
    }

    forkEvery = 1
}
