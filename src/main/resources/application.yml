spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/invoice_intelligence
    username: invoice
    password: invoice

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      ack-mode: manual
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

ollama:
  base-url: http://localhost:11434
  model: gemma3:12b

invoice:
  processing:
    mode: kafka
    poll-interval: 1s
    recovery-interval: 5s
    max-automatic-retries: 3
    outbox-poll-interval: 1000
    scheduling-enabled: true

tesseract:
  datapath: ${TESSDATA_PREFIX}
  language: eng